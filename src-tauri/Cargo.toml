[package]
name = "aria"
version = "0.1.0"
description = "ARIA — Adaptive Reasoning Intelligence Assistant (desktop shell)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "aria"
path = "src/main.rs"
